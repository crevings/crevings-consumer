# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx1536m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# --- AGP 9 compatibility opt-outs (REQUIRED — do not remove) ---
# @capacitor/geolocation's Android module applies the legacy
# org.jetbrains.kotlin.android plugin (KGP 2.2.20), which per the AGP 9.0
# release notes is incompatible with AGP 9's built-in Kotlin and the new DSL.
# These two opt-outs keep the build working; AGP prints deprecation warnings
# for them (and for the legacy variant API they re-expose) until the geolocation
# plugin migrates. AGP 10 will remove the opt-out, so this must be fixed
# upstream (see https://developer.android.com/build/releases/agp-9-0-0-release-notes).
android.builtInKotlin=false
android.newDsl=false

# AGP-sanctioned suppression for the obsolete variant-API warnings that are an
# expected side effect of the android.newDsl=false opt-out above (they are
# informational; the DSL actually used is the legacy one this flag re-enables).
# FLAT_DIR_REPOSITORY_USED: the remaining flatDir repo lives in the regenerated
#   capacitor-cordova-android-plugins module (it comes back on every cap sync).
# LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED: performance hint aimed at very large
#   projects; irrelevant at this project's scale.
android.sync.suppressAgpWarnings=DEPRECATED_DSL,FLAT_DIR_REPOSITORY_USED,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED
