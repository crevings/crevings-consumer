<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <!--
      user-scalable=no + maximum-scale=1 fix the interface scale so the app
      never zooms. This is the Capacitor Android shell's first line of defense;
      the inline script below backs it up for WebViews that ignore the meta tag.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Food Delivery Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #ffffff;
        --text-primary: #0f172a;
        --card-bg: #ffffff;
        --text-card: #1e293b;
      }
      body {
        font-family: 'Open Sans', sans-serif !important;
      }
      .dark {
        --bg-primary: #ffffff;
        --text-primary: #0f172a;
        --card-bg: #ffffff;
        --text-card: #1e293b;
      }
      body, 
      .bg-slate-50, 
      .bg-\[\#f4f5f7\], 
      .min-h-screen {
        background-color: #ffffff !important;
      }
      /* Hide scrollbar for clean horizontal scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes slideUp {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmer {
        100% { transform: translateX(100%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Check for saved theme preference
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <script>
      // Pinch-to-zoom / double-tap-zoom guard.
      //
      // Some Android WebViews ignore `user-scalable=no`, so block the gesture
      // events directly: multi-touch moves (pinch), the legacy iOS gesture
      // events, and desktop ctrl+wheel / ctrl+± zoom. Scroll and one-finger
      // panning are untouched. Pinch gestures inside the embedded Google Maps
      // canvas (.gm-style) are exempt — that's map navigation, not page zoom,
      // and the map consumes the gesture so the page never scales.
      (function () {
        function insideMap(target) {
          var el = target instanceof Element ? target : null;
          while (el) {
            if (el.classList && el.classList.contains('gm-style')) return true;
            el = el.parentElement;
          }
          return false;
        }
        document.addEventListener('touchmove', function (e) {
          if (e.touches && e.touches.length > 1 && !insideMap(e.target)) e.preventDefault();
        }, { passive: false });
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (name) {
          document.addEventListener(name, function (e) { e.preventDefault(); });
        });
        document.addEventListener('wheel', function (e) {
          if (e.ctrlKey) e.preventDefault();
        }, { passive: false });
        document.addEventListener('keydown', function (e) {
          if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0' || e.key === '=')) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
